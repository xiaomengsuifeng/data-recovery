[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-recovery-core"
version = "0.3.0rc2"
description = "Local NTFS/exFAT desktop recovery, read-only acquisition and resumable scans"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.urls]
Repository = "https://github.com/xiaomengsuifeng/data-recovery"
Issues = "https://github.com/xiaomengsuifeng/data-recovery/issues"
Releases = "https://github.com/xiaomengsuifeng/data-recovery/releases"

[project.optional-dependencies]
desktop = ["PySide6-Essentials==6.8.3"]
audit = ["pefile==2024.8.26"]
test = ["coverage==7.16.1"]

[project.scripts]
recovery = "recovery_core.cli:main"
recovery-desktop = "recovery_desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]
